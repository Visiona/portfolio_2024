promotions:
  title: Accenture Promotions
  url: /accenture-promotions.html
  image: /assets/images/work_1_md_promo.webp
  image_alt: Accenture Promotions search and filtering interface
  type: UX Research · UI Design · Frontend
  role: UX researcher, UI designer and frontend developer
  client: Accenture
  summary: A global promotions search experience designed to keep a dataset of up to 100,000 employees fast, secure and easy to navigate.
  proof_value: 160k
  proof_label: views in the first launch week
  outcome: Ten familiar multi-select filters and a maintainable seven-step publishing workflow helped set a new internal benchmark.

onboarding:
  title: Accenture Onboarding Hub
