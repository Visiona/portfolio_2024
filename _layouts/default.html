<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {%- if page.title -%}{{ page.title }} | {% endif -%}{{ site.title }}
    </title>

    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_newlines | escape }}"
    />
    <meta name="theme-color" content="#f5f7f3" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <script>
      document.documentElement.classList.add('js')
    </script>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />

    {% if page.preload_hero %}
    <link
      rel="preload"
      as="image"
      href="{{ '/assets/images/hero-workspace-640.webp' | relative_url }}"
      imagesrcset="
        {{ '/assets/images/hero-workspace-640.webp' | relative_url }} 640w,
        {{ '/assets/images/hero-workspace-960.webp' | relative_url }} 960w
      "
      imagesizes="(min-width: 48rem) 38vw, calc(100vw - 2rem)"
      fetchpriority="high"
    />
    {% endif %}

    <script src="{{ '/assets/js/script.js' | relative_url }}" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {% include navigation.html %}

    <main id="main" tabindex="-1">{{ content }}</main>

    {% include footer.html %}
  </body>
</html>
